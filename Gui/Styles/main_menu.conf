# --- NS3 Engine UI Window Theme Configuration ---
WindowRounding: 0.0
FrameRounding: 0.0

# Colors are parsed as standard normalized vector points: Red Green Blue Alpha
ColorText: 0.95 0.95 0.95 1.0
ColorButton: 0.12 0.35 0.65 1.0

# Custom local button/frame margins ---
FramePadding: 4.0 4.0

# Set horizontal spacing between widgets to a smaller value ---
ItemSpacing: 2.0 2.0
